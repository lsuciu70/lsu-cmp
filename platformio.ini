; ESP32-C3 CAN -> ASAM CMP UDP sender. See SPEC.md and README.md.
;
;   pio run -e ota -t upload   over WiFi (default; board at 192.168.100.240)
;   pio run -e usb -t upload   over USB (first flash, or recovery)
;   pio device monitor         log over WiFi (TCP port 23)
;   pio device monitor -e usb  log over USB
; In AP mode (no saved network in range) upload to 10.10.10.10 instead:
;   pio run -e ota -t upload --upload-port 10.10.10.10
;   pio device monitor --port socket://10.10.10.10:23

[platformio]
default_envs = ota

[esp32]
platform = platformio/espressif32 @ ^7.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    git+ssh://git@github.com/lsuciu70/lsu-esp32-wifi.git#v0.1.1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLSUWIFI_DEFAULT_AP_SSID=\"lsu-cmp\"

[env:ota]
extends = esp32
upload_protocol = espota
upload_port = 192.168.100.240
monitor_port = socket://192.168.100.240:23

[env:usb]
extends = esp32

; Host unit tests for the CMP encoder: pio test -e native
[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
